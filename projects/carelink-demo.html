<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareLink Patient Safety Hub Demo</title>
  <style>
    :root { --bg:#0e1520; --panel:#172335; --accent:#f472b6; --accent-2:#ec4899; --text:#fdf2f8; --muted:#d8c9d9; --line: rgba(255,255,255,.08); }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #101827, #1d2f4d); color: var(--text); }
    .wrap { max-width:1200px; margin:0 auto; padding:28px 18px 50px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:24px; padding:12px 18px; border-radius:18px; border:1px solid var(--line); background: rgba(255,255,255,.02); }
    .brand { font-size:1.35rem; font-weight:700; }
    .nav-link { color: var(--text); text-decoration:none; border:1px solid rgba(244,114,182,.35); padding:8px 12px; border-radius:999px; background: rgba(244,114,182,.08); }
    .tag { padding:8px 12px; border-radius:999px; background: rgba(244,114,182,.12); border:1px solid rgba(244,114,182,.4); color: #f9a8d4; }
    .grid { display:grid; grid-template-columns:1.15fr 0.85fr; gap:18px; }
    .panel { background: rgba(23,35,53,.96); border:1px solid var(--line); border-radius:22px; padding:20px; }
    .monitor { background: linear-gradient(180deg, rgba(244,114,182,.08), rgba(52,211,153,.04)); border:1px solid rgba(244,114,182,.25); border-radius:14px; min-height:200px; display:flex; align-items:center; justify-content:center; font-size:4rem; }
    .rows { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
    .row { display:flex; justify-content:space-between; background: rgba(255,255,255,.03); border-radius:10px; padding:12px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:18px; }
    .stat { background: rgba(255,255,255,.02); border:1px solid var(--line); border-radius:12px; padding:14px; }
    .stat h4 { margin:0 0 10px; color: var(--muted); font-size:0.8rem; }
    .stat strong { font-size:1.7rem; }
    ul { list-style:none; padding:0; margin-top:18px; }
    ul li { padding:10px 0; border-bottom:1px solid var(--line); color: var(--muted); }
    .spark { display:flex; align-items:flex-end; gap:8px; height:70px; margin-top:18px; }
    .spark span { display:block; width: 15%; background: linear-gradient(180deg, var(--accent), var(--accent-2)); border-radius:8px 8px 0 0; }
    @media (max-width:820px) { .grid { grid-template-columns:1fr; } .stats { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">CareLink Patient Safety Hub</div>
      <div style="display:flex; align-items:center; gap:12px;">
        <a class="nav-link" href="../Christine Joy D. Ilonen - Professional Portfolio v3.html">← Portfolio</a>
        <div class="tag">Monitoring Active</div>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="monitor">🏥</div>
        <div class="rows">
          <div class="row"><span>Occupied Beds</span><strong id="beds">18 / 24</strong></div>
          <div class="row"><span>Emergency Alerts</span><strong id="alerts">3</strong></div>
          <div class="row"><span>Staff Response</span><strong id="response">1.8 min</strong></div>
        </div>
        <div class="spark">
          <span style="height:45%;"></span>
          <span style="height:68%;"></span>
          <span style="height:71%;"></span>
          <span style="height:84%;"></span>
          <span style="height:58%;"></span>
          <span style="height:92%;"></span>
        </div>
      </div>

      <div class="panel">
        <h3>Safety Snapshot</h3>
        <div class="stats">
          <div class="stat"><h4>Pulse</h4><strong id="pulse">72</strong></div>
          <div class="stat"><h4>O₂</h4><strong id="oxygen">98%</strong></div>
          <div class="stat"><h4>Alerts</h4><strong id="alert-count">2</strong></div>
        </div>
        <ul>
          <li>✅ Patient monitors synchronized</li>
          <li>✅ Nurse alerts received</li>
          <li>⚠️ 1 equipment check required</li>
          <li>✅ Emergency hotline linked</li>
        </ul>
      </div>
    </div>
  </div>
  <script>
    const beds = document.querySelector('#beds');
    const alerts = document.querySelector('#alerts');
    const response = document.querySelector('#response');
    const pulse = document.querySelector('#pulse');
    const oxygen = document.querySelector('#oxygen');
    const alertCount = document.querySelector('#alert-count');
    const tag = document.querySelector('.tag');

    setInterval(() => {
      const active = Math.random() > 0.5;
      if (active) {
        beds.textContent = '20 / 24';
        alerts.textContent = '2';
        response.textContent = '1.4 min';
        pulse.textContent = '74';
        oxygen.textContent = '97%';
        alertCount.textContent = '1';
        tag.textContent = 'Response Ready';
      } else {
        beds.textContent = '18 / 24';
        alerts.textContent = '3';
        response.textContent = '1.8 min';
        pulse.textContent = '72';
        oxygen.textContent = '98%';
        alertCount.textContent = '2';
        tag.textContent = 'Monitoring Active';
      }
    }, 4000);
  </script>
</body>
</html>
