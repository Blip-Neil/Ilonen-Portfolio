<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SecureDoor Access System Demo</title>
  <style>
    :root { --bg:#0a1220; --panel:#101c2d; --accent:#38bdf8; --accent-2:#22d3ee; --success:#34d399; --text:#eaf9ff; --muted:#b8d6e7; --line: rgba(255,255,255,.08); }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #08131c, #15263a); color: var(--text); }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 18px 50px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:24px; padding: 12px 18px; border-radius: 18px; border: 1px solid var(--line); background: rgba(255,255,255,.02); }
    .brand { font-size:1.35rem; font-weight:700; }
    .nav-link { color: var(--text); text-decoration:none; border: 1px solid rgba(56,189,248,.35); padding: 8px 12px; border-radius: 999px; background: rgba(56,189,248,.08); }
    .badge { background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.4); color: var(--success); border-radius: 999px; padding: 8px 12px; }
    .grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 18px; }
    .panel { background: rgba(16,28,45,.94); border: 1px solid var(--line); border-radius: 22px; padding: 20px; }
    .door { background: linear-gradient(180deg, rgba(52,211,153,0.08), rgba(56,189,248,0.08)); }
    .door-box { width: 100%; max-width: 280px; height: 190px; margin: 0 auto 20px; border-radius: 18px; background: linear-gradient(180deg, #091220, #132b40); border: 2px solid rgba(56,189,248,.3); display:flex; align-items:center; justify-content:center; font-size:4rem; }
    .button-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .btn { border: none; border-radius: 12px; padding: 12px; font-weight: 700; cursor: pointer; }
    .btn.primary { background: linear-gradient(135deg, #38bdf8, #22d3ee); color: #06223a; }
    .btn.secondary { background: #1f2937; color: var(--text); border: 1px solid rgba(56,189,248,.2); }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
    .stat { background: rgba(255,255,255,.02); border:1px solid var(--line); border-radius: 12px; padding:14px; }
    .stat h4 { margin: 0 0 10px; color: var(--muted); font-size: 0.8rem; }
    .stat strong { font-size:1.7rem; }
    ul { list-style:none; padding:0; margin-top:18px; }
    ul li { padding:10px 0; border-bottom:1px solid var(--line); color: var(--muted); }
    .spark { display:flex; gap:6px; align-items:flex-end; height: 60px; margin-top:18px; }
    .spark span { background: linear-gradient(180deg, var(--accent), var(--accent-2)); display:block; width: 14%; border-radius: 8px 8px 0 0; }
    @media (max-width: 820px) { .grid { grid-template-columns:1fr; } .stats { grid-template-columns:1fr; } .button-row { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">SecureDoor Access System</div>
      <div style="display:flex; align-items:center; gap:12px;">
        <a class="nav-link" href="../Christine Joy D. Ilonen - Professional Portfolio v3.html">← Portfolio</a>
        <div class="badge">Authorized Access</div>
      </div>
    </div>

    <div class="grid">
      <div class="panel door">
        <div class="door-box">🚪</div>
        <div class="button-row">
          <button class="btn primary" data-action="unlock">Unlock</button>
          <button class="btn secondary" data-action="lock">Lock</button>
          <button class="btn secondary" data-action="logs">Logs</button>
        </div>
        <div class="spark">
          <span style="height: 40%;"></span>
          <span style="height: 55%;"></span>
          <span style="height: 68%;"></span>
          <span style="height: 74%;"></span>
          <span style="height: 62%;"></span>
          <span style="height: 82%;"></span>
          <span style="height: 90%;"></span>
        </div>
      </div>

      <div class="panel">
        <h3>Access Status</h3>
        <div class="stats">
          <div class="stat"><h4>Doors</h4><strong id="door-count">12</strong></div>
          <div class="stat"><h4>Users</h4><strong id="user-count">240</strong></div>
          <div class="stat"><h4>Alerts</h4><strong id="alert-count">2</strong></div>
        </div>
        <ul>
          <li>✅ Employee access verified</li>
          <li>✅ Camera feed linked</li>
          <li>⚠️ 1 failed attempt logged</li>
          <li>✅ Access log synchronized</li>
        </ul>
      </div>
    </div>
  </div>
  <script>
    const doorBadge = document.querySelector('.badge');
    const doorBox = document.querySelector('.door-box');
    const doorCount = document.querySelector('#door-count');
    const alertCount = document.querySelector('#alert-count');

    document.querySelectorAll('.btn').forEach((button) => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;
        if (action === 'unlock') {
          doorBadge.textContent = 'Door Unlocked';
          doorBox.textContent = '🔓';
          doorCount.textContent = '12';
          alertCount.textContent = '1';
        } else if (action === 'lock') {
          doorBadge.textContent = 'Door Locked';
          doorBox.textContent = '🔒';
          alertCount.textContent = '2';
        } else {
          doorBadge.textContent = 'Logs Updated';
          doorBox.textContent = '📋';
          alertCount.textContent = '0';
        }
      });
    });
  </script>
</body>
</html>
