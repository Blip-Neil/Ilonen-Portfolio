<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PharmaVend Smart Dispenser Demo</title>
  <style>
    :root {
      --bg: #06131b;
      --bg-2: #0d1f2d;
      --panel: rgba(11, 28, 38, 0.92);
      --panel-2: rgba(15, 39, 52, 0.92);
      --accent: #4ade80;
      --accent-2: #22d3ee;
      --text: #ebfffb;
      --muted: #a8d5d2;
      --line: rgba(255,255,255,.08);
      --warning: #fbbf24;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, var(--bg), var(--bg-2));
      color: var(--text);
    }
    .wrap { max-width: 1200px; margin: 0 auto; padding: 28px 18px 50px; }
    .topbar {
      display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px;
      padding: 12px 18px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,0.02);
    }
    .brand { font-size: 1.35rem; font-weight: 700; }
    .nav-link {
      color: var(--text); text-decoration: none; border: 1px solid rgba(34,211,238,.35); padding: 8px 12px; border-radius: 999px; background: rgba(34,211,238,.08);
    }
    .status { padding: 8px 14px; border-radius: 999px; background: rgba(74, 222, 128, 0.12); color: var(--accent); border: 1px solid rgba(74, 222, 128, 0.5); }
    .grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 20px; }
    .panel {
      background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 20px; box-shadow: 0 18px 40px rgba(0,0,0,.18);
    }
    .display-box {
      background: linear-gradient(180deg, rgba(74,222,128,.08), rgba(34,211,238,.05));
      border: 1px solid rgba(34,211,238,.25); border-radius: 16px; min-height: 180px; display: flex; align-items: center; justify-content: center;
      text-align: center; font-size: clamp(1.5rem, 2vw, 2.2rem); color: var(--text);
      padding: 12px;
    }
    .btns { display: grid; grid-template-columns: repeat(2, minmax(120px, 1fr)); gap: 12px; margin-top: 18px; }
    .btn {
      border: none; border-radius: 12px; padding: 12px 10px; font-weight: 700; cursor: pointer; color: #04131d;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
    }
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 18px; }
    .stat { background: rgba(255,255,255,.02); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
    .stat h4 { margin: 0 0 10px; color: var(--muted); font-size: 0.8rem; }
    .stat strong { font-size: 1.6rem; }
    .list { list-style: none; padding: 0; margin: 16px 0 0; }
    .list li { padding: 10px 0; border-bottom: 1px solid var(--line); color: var(--muted); }
    .mini-chart { display: flex; align-items: end; gap: 8px; height: 70px; margin-top: 18px; }
    .bar { flex: 1; background: linear-gradient(180deg, var(--accent), var(--accent-2)); border-radius: 8px 8px 0 0; }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } .stats { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">PharmaVend Smart Dispenser</div>
      <div style="display:flex; align-items:center; gap:12px;">
        <a class="nav-link" href="../Christine Joy D. Ilonen - Professional Portfolio v3.html">← Portfolio</a>
        <div class="status">System Online</div>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="display-box">💊 Medicine Ready</div>
        <div class="btns">
          <button class="btn" data-action="dispense-a">Dispense A</button>
          <button class="btn" data-action="dispense-b">Dispense B</button>
          <button class="btn" data-action="dispense-c">Dispense C</button>
          <button class="btn" data-action="scan">Scan ID</button>
        </div>
        <div class="mini-chart">
          <div class="bar" style="height: 45%;"></div>
          <div class="bar" style="height: 58%;"></div>
          <div class="bar" style="height: 72%;"></div>
          <div class="bar" style="height: 66%;"></div>
          <div class="bar" style="height: 80%;"></div>
          <div class="bar" style="height: 92%;"></div>
        </div>
      </div>

      <div class="panel">
        <h3>Live Monitor</h3>
        <div class="stats">
          <div class="stat"><h4>Stock</h4><strong id="stock-value">94%</strong></div>
          <div class="stat"><h4>Temp</h4><strong id="temp-value">24°C</strong></div>
          <div class="stat"><h4>Access</h4><strong id="access-value">5</strong></div>
        </div>
        <ul class="list">
          <li>✅ Verified user access</li>
          <li>✅ Inventory synchronized</li>
          <li>⚠️ 2 items low in stock</li>
          <li>✅ Security log updated</li>
        </ul>
      </div>
    </div>
  </div>
  <script>
    const display = document.querySelector('.display-box');
    const status = document.querySelector('.status');
    const stockValue = document.querySelector('#stock-value');
    const tempValue = document.querySelector('#temp-value');
    const accessValue = document.querySelector('#access-value');

    document.querySelectorAll('.btn').forEach((button) => {
      button.addEventListener('click', () => {
        const action = button.dataset.action;

        if (action === 'scan') {
          display.textContent = '✅ Patient Verified';
          status.textContent = 'Access Verified';
          accessValue.textContent = '6';
          return;
        }

        const med = action.replace('dispense-', '').toUpperCase();
        display.textContent = `💊 ${med} Dispensed`;
        status.textContent = 'Dispense Successful';

        const currentStock = Number.parseInt(stockValue.textContent, 10) || 94;
        const nextStock = Math.max(80, currentStock - 3);
        stockValue.textContent = `${nextStock}%`;
        tempValue.textContent = `${24 + (Math.random() * 2).toFixed(1)}°C`;
      });
    });
  </script>
</body>
</html>
