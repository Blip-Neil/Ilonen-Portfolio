<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ColdGuard Storage System Demo</title>
  <style>
    :root { --bg:#091a2f; --panel:#10253d; --accent:#60a5fa; --accent-2:#3b82f6; --text:#eef8ff; --muted:#bed8ee; --line: rgba(255,255,255,.08); }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Segoe UI', Arial, sans-serif; background: linear-gradient(135deg, #091827, #10253d); color: var(--text); }
    .wrap { max-width:1200px; margin:0 auto; padding:28px 18px 50px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; gap:12px; margin-bottom:24px; padding:12px 18px; border-radius:18px; border:1px solid var(--line); background: rgba(255,255,255,.02); }
    .brand { font-size:1.35rem; font-weight:700; }
    .nav-link { color: var(--text); text-decoration:none; border:1px solid rgba(96,165,250,.4); padding:8px 12px; border-radius:999px; background: rgba(96,165,250,.08); }
    .tag { padding:8px 12px; border-radius:999px; background: rgba(96,165,250,.14); border:1px solid rgba(96,165,250,.35); color: var(--accent); }
    .grid { display:grid; grid-template-columns:1.1fr 0.9fr; gap:18px; }
    .panel { background: rgba(16,37,61,.96); border:1px solid var(--line); border-radius:22px; padding:20px; }
    .chamber { background: linear-gradient(180deg, rgba(96,165,250,.1), rgba(34,197,94,.05)); border:1px solid rgba(96,165,250,.25); border-radius:14px; min-height:200px; display:flex; align-items:center; justify-content:center; font-size:4rem; }
    .rows { display:flex; flex-direction:column; gap:10px; margin-top:14px; }
    .row { display:flex; justify-content:space-between; background: rgba(255,255,255,.03); border-radius:10px; padding:12px; }
    .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:18px; }
    .stat { background: rgba(255,255,255,.02); border:1px solid var(--line); border-radius:12px; padding:14px; }
    .stat h4 { margin:0 0 10px; color: var(--muted); font-size:0.8rem; }
    .stat strong { font-size:1.7rem; }
    ul { list-style:none; padding:0; margin-top:18px; }
    ul li { padding:10px 0; border-bottom:1px solid var(--line); color: var(--muted); }
    .spark { display:flex; align-items:flex-end; gap:8px; height:70px; margin-top:18px; }
    .spark span { display:block; width: 15%; background: linear-gradient(180deg, var(--accent), var(--accent-2)); border-radius:8px 8px 0 0; }
    @media (max-width:820px) { .grid { grid-template-columns:1fr; } .stats { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">ColdGuard Storage System</div>
      <div style="display:flex; align-items:center; gap:12px;">
        <a class="nav-link" href="../Christine Joy D. Ilonen - Professional Portfolio v3.html">← Portfolio</a>
        <div class="tag">Temperature Stable</div>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <div class="chamber">🧊</div>
        <div class="rows">
          <div class="row"><span>Chamber Temp</span><strong id="temp">4°C</strong></div>
          <div class="row"><span>Humidity</span><strong id="humidity">43%</strong></div>
          <div class="row"><span>Door Status</span><strong id="door-status">Closed</strong></div>
        </div>
        <div class="spark">
          <span style="height:42%;"></span>
          <span style="height:52%;"></span>
          <span style="height:67%;"></span>
          <span style="height:73%;"></span>
          <span style="height:60%;"></span>
          <span style="height:80%;"></span>
        </div>
      </div>

      <div class="panel">
        <h3>Monitoring</h3>
        <div class="stats">
          <div class="stat"><h4>Alerts</h4><strong id="alerts">1</strong></div>
          <div class="stat"><h4>Power</h4><strong id="power">99%</strong></div>
          <div class="stat"><h4>Backup</h4><strong id="backup">On</strong></div>
        </div>
        <ul>
          <li>✅ Safe temperature maintained</li>
          <li>✅ Alarm system armed</li>
          <li>⚠️ Door left open for 4 mins</li>
          <li>✅ Auto-notification enabled</li>
        </ul>
      </div>
    </div>
  </div>
  <script>
    const temp = document.querySelector('#temp');
    const humidity = document.querySelector('#humidity');
    const doorStatus = document.querySelector('#door-status');
    const alerts = document.querySelector('#alerts');
    const power = document.querySelector('#power');
    const backup = document.querySelector('#backup');
    const tag = document.querySelector('.tag');

    document.body.addEventListener('click', () => {
      const currentTemp = Number.parseInt(temp.textContent, 10) || 4;
      const nextTemp = currentTemp === 4 ? 6 : 4;
      const nextHumidity = currentTemp === 4 ? 48 : 43;
      temp.textContent = `${nextTemp}°C`;
      humidity.textContent = `${nextHumidity}%`;
      doorStatus.textContent = 'Opened';
      alerts.textContent = '2';
      power.textContent = '96%';
      backup.textContent = 'Standby';
      tag.textContent = 'Alert Triggered';
    });

    setInterval(() => {
      temp.textContent = '4°C';
      humidity.textContent = '43%';
      doorStatus.textContent = 'Closed';
      alerts.textContent = '1';
      power.textContent = '99%';
      backup.textContent = 'On';
      tag.textContent = 'Temperature Stable';
    }, 5500);
  </script>
</body>
</html>
